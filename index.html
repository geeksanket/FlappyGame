  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverDiv = document.getElementById('gameOver');
    const finalScoreEl = document.getElementById('finalScore');
    const highScoreEl = document.getElementById('highScore');
    const musicSel = document.getElementById('music');
    const chaosMeterEl = document.getElementById('chaosMeter');
    const chaosTextEl = document.getElementById('chaosText');
    const statusTextEl = document.getElementById('statusText');
    const modeIndicatorEl = document.getElementById('modeIndicator');
    const chaosMessageEl = document.getElementById('chaosMessage');
 
    // assets
    const birdImg = new Image(); birdImg.src = 'pepa.png';
    const flapSound = new Audio('huh.mp3');
    const hitSound = new Audio('laugh.mp3');
    const scoreSound = new Audio('yipee.mp3');
    let bgMusic = new Audio(musicSel.value); bgMusic.loop = true; bgMusic.volume = 0.5;
 
    // CHAOS VARIABLES
    let chaosLevel = 0;
    let pipeSpeedMultiplier = 1;
    let gravityMultiplier = 1;
    let screenShakeIntensity = 0;
    let invertedControls = false;
    let birdRotation = 0;
    let birdScale = 1;
    let lavaMode = false;
    let ballMode = false;
    let slowMode = false;
    let superFlappyMode = false;
    let teleportMode = false;
    let ghostMode = false;
    let rainbowMode = false;
    let randomEvents = [];
    let particles = [];
    let pipeSpinning = false;
 
    let bird = { x:80, y:250, w:34, h:24, vel:0, gravity:900, jump:-350 };
    let pipes = [];
    let score = 0, highScore = 0;
    let frame = 0, gameRunning = false, gameStarted = false;
    let lastTime = performance.now();
    let flapCount = 0;
 
    const gradientPhases = [
      { top:'#ff006e', bottom:'#8338ec' },
      { top:'#3a86ff', bottom:'#8338ec' },
      { top:'#fb5607', bottom:'#ffbe0b' },
      { top:'#8338ec', bottom:'#3a86ff' }
    ];
 
    function blend(a,b,t){
      const n1=parseInt(a.slice(1),16),n2=parseInt(b.slice(1),16);
      const r=Math.floor(((n1>>16)*(1-t))+((n2>>16)*t));
      const g=Math.floor((((n1>>8)&0xff)*(1-t))+(((n2>>8)&0xff)*t));
      const bl=Math.floor(((n1&0xff)*(1-t))+((n2&0xff)*t));
      return `rgb(${r},${g},${bl})`;
    }
 
    function updateChaosLevel(){
      chaosLevel = Math.min(100, Math.floor((score / 20) * 100));
      chaosMeterEl.style.width = chaosLevel + '%';
      chaosTextEl.textContent = chaosLevel + '%';
 
      if(chaosLevel > 80){
        modeIndicatorEl.textContent = '🌪️ ABSOLUTE MADNESS 🌪️';
        superFlappyMode = true;
        rainbowMode = true;
        pipeSpinning = true;
      }else if(chaosLevel > 60){
        modeIndicatorEl.textContent = '⚡ CHAOS MODE ⚡';
        ghostMode = true;
        teleportMode = true;
        lavaMode = true;
      }else if(chaosLevel > 40){
        modeIndicatorEl.textContent = '🎪 WACKY MODE 🎪';
        ballMode = true;
        slowMode = false;
      }else if(chaosLevel > 20){
        modeIndicatorEl.textContent = '😵 WEIRD MODE 😵';
        invertedControls = true;
      }else{
        modeIndicatorEl.textContent = '✨ NORMAL MODE ✨';
        invertedControls = false;
        ballMode = false;
        ghostMode = false;
        teleportMode = false;
        lavaMode = false;
        superFlappyMode = false;
        pipeSpinning = false;
        rainbowMode = false;
      }
 
      pipeSpeedMultiplier = 1 + (chaosLevel / 100) * 2;
      gravityMultiplier = 1 + (chaosLevel / 100) * 1.5;
    }
 
    function updateBackground(){
      const phaseTime=200;const i=Math.floor((frame/phaseTime)%gradientPhases.length);
      const next=(i+1)%gradientPhases.length;const t=(frame%phaseTime)/phaseTime;
      const topBlend=blend(gradientPhases[i].top,gradientPhases[next].top,t);
      const bottomBlend=blend(gradientPhases[i].bottom,gradientPhases[next].bottom,t);
      
      if(rainbowMode){
        const hue = (frame * 2) % 360;
        document.body.style.background = `hsl(${hue},100%,50%)`;
        canvas.style.background = `hsl(${(hue+180)%360},100%,50%)`;
      }else{
        document.body.style.background=`linear-gradient(to bottom,${topBlend},${bottomBlend})`;
        canvas.style.background=`linear-gradient(to bottom,${bottomBlend},${topBlend})`;
      }
    }
 
    function createParticles(x,y,color='#ffbe0b'){
      for(let i=0;i<8;i++){
        particles.push({
          x,y,
          vx:(Math.random()-0.5)*6,
          vy:(Math.random()-0.5)*6,
          life:1,
          color,
          size:Math.random()*4+2
        });
      }
    }
 
    function drawBird(){
      ctx.save();
      ctx.translate(bird.x+bird.w/2,bird.y+bird.h/2);
      if(ballMode){
        ctx.fillStyle=rainbowMode?`hsl(${(frame*5)%360},100%,50%)`:ghostMode?'rgba(255,255,255,0.5)':'#ffbe0b';
        ctx.beginPath();ctx.arc(0,0,bird.w/2,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      }else{
        ctx.rotate(birdRotation);
        ctx.scale(birdScale,birdScale);
        ctx.globalAlpha=ghostMode?0.5:1;
        ctx.drawImage(birdImg,-bird.w/2,-bird.h/2,bird.w,bird.h);
      }
      ctx.restore();
    }
 
    function drawPipes(){
      pipes.forEach(p=>{
        ctx.save();
        if(pipeSpinning){
          ctx.translate(p.x+30,canvas.height/2);
          ctx.rotate((frame*0.05)%Math.PI*2);
          ctx.translate(-30,-canvas.height/2);
        }
        
        ctx.fillStyle=rainbowMode?`hsl(${(frame*3+p.x)%360},100%,50%)`:lavaMode?'#ff4500':'#2ecc71';
        ctx.fillRect(p.x,0,60,p.top);
        ctx.fillRect(p.x,p.top+150,60,canvas.height-p.top-150);
        
        if(lavaMode){
          ctx.fillStyle='rgba(255,100,0,0.4)';
          for(let i=0;i<3;i++){
            ctx.fillRect(p.x-5+i*10,p.top-5,8,8);
            ctx.fillRect(p.x-5+i*10,p.top+150-5,8,8);
          }
        }
        ctx.restore();
      });
    }
 
    function drawGround(){
      ctx.fillStyle=rainbowMode?`hsl(${(frame*2)%360},100%,50%)`:lavaMode?'#8b0000':'#8b4513';
      ctx.fillRect(0,canvas.height-50,canvas.width,50);
      if(lavaMode){
        ctx.fillStyle='rgba(255,150,0,0.6)';
        for(let i=0;i<Math.floor(canvas.width/30);i++){
          ctx.fillRect(i*30,canvas.height-50,20,20);
        }
      }
    }
 
    function drawParticles(){
      particles.forEach((p,i)=>{
        ctx.fillStyle=p.color;
        ctx.globalAlpha=p.life;
        ctx.fillRect(p.x,p.y,p.size,p.size);
        p.x+=p.vx;p.y+=p.vy;
        p.life-=0.02;
      });
      particles=particles.filter(p=>p.life>0);
      ctx.globalAlpha=1;
    }
 
    function updateBird(dt){
      bird.vel += bird.gravity * gravityMultiplier * dt;
      bird.y += bird.vel * dt;
      
      if(superFlappyMode && frame%10===0){
        birdRotation+=(Math.random()-0.5)*0.5;
        birdScale=1+Math.sin(frame*0.1)*0.2;
      }
      
      if(bird.y + bird.h > canvas.height - 50) endGame();
      if(bird.y < 0) bird.y = 0;
    }
 
    function updatePipes(dt){
      const spawnRate = Math.max(50,Math.floor(100-chaosLevel));
      if(frame % spawnRate === 0){
        const top = Math.random() * (canvas.height - 250) + 50;
        pipes.push({x:canvas.width,top,scored:false,wobble:0});
      }
      
      pipes.forEach(p=>{
        p.x -= 200 * dt * pipeSpeedMultiplier;
        if(ballMode) p.wobble += 0.05;
        
        if(!p.scored && p.x + 60 < bird.x){
          p.scored = true; 
          flapCount=0;
          score++; 
          scoreEl.textContent=score;
          updateChaosLevel();
          createParticles(bird.x,bird.y,'#ffbe0b');
          scoreSound.currentTime=0; scoreSound.play().catch(()=>{});
          screenShakeIntensity=5;
        }
        
        let pipeY=p.top;
        if(ballMode) pipeY+=Math.sin(p.wobble)*20;
        
        if(bird.x + bird.w > p.x && bird.x < p.x + 60 &&
           (bird.y < pipeY || bird.y + bird.h > pipeY + 150)){
          if(ghostMode && Math.random()>0.3) return;
          createParticles(bird.x,bird.y,'#ff006e');
          hitSound.play().catch(()=>{}); 
          screenShakeIntensity=10;
          endGame();
        }
      });
      pipes = pipes.filter(p => p.x + 60 > 0);
    }
 
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      
      if(screenShakeIntensity>0){
        const shake=screenShakeIntensity;
        ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
        screenShakeIntensity*=0.9;
      }
      
      drawPipes(); 
      drawBird(); 
      drawGround();
      drawParticles();
      
      if(!gameStarted){
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#ffbe0b';ctx.font='bold 24px Arial';ctx.textAlign='center';
        ctx.fillText('🎮 TAP/PRESS SPACE TO START! 🎮',canvas.width/2,canvas.height/2);
        ctx.font='bold 16px Arial';
        ctx.fillText('Get ready for CHAOS! 🌪️',canvas.width/2,canvas.height/2+40);
      }
    }
 
    function gameLoop(now){
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      if(gameRunning){
        updateBird(dt);
        updatePipes(dt);
      }
      updateBackground();
      draw();
      frame++;
      requestAnimationFrame(gameLoop);
    }
 
    function flap(){
      if(!gameStarted){
        gameStarted=true;gameRunning=true;
        bgMusic.play().catch(()=>{});
        statusTextEl.textContent='LET\'S GO! 🚀';
      }
      if(gameRunning){
        flapCount++;
        const jumpForce = invertedControls ? 350 : -350;
        bird.vel = (superFlappyMode ? jumpForce * 1.5 : jumpForce);
        
        if(teleportMode && Math.random()>0.8){
          bird.y = Math.random() * (canvas.height - 100);
          createParticles(bird.x,bird.y,'#3a86ff');
        }
        
        birdRotation = invertedControls ? 0.3 : -0.3;
        flapSound.currentTime=0; flapSound.play().catch(()=>{});
        createParticles(bird.x+bird.w,bird.y+bird.h/2,'#fb5607');
      }
    }
 
    document.addEventListener('keydown', e=>{if(e.code==='Space'){e.preventDefault();flap();}});
    canvas.addEventListener('click', flap);
    canvas.addEventListener('touchstart', e=>{e.preventDefault();flap();},{passive:false});
 
    function endGame(){
      gameRunning=false;
      if(score>highScore) highScore=score;
      finalScoreEl.textContent=score; 
      highScoreEl.textContent=highScore;
      
      const chaosMessages=[
        '🎭 You survived ' + chaosLevel + '% chaos!',
        '🌪️ The madness consumed you!',
        '💥 KABOOM! Better luck next time!',
        '🔥 Chaos wins again!',
        '✨ Not bad, but not chaos enough!'
      ];
      chaosMessageEl.textContent = chaosMessages[Math.floor(Math.random()*chaosMessages.length)];
      gameOverDiv.style.display='block';
    }
 
    function restartGame(){
      bird.y=250; 
      bird.vel=0; 
      pipes=[]; 
      score=0; 
      flapCount=0;
      chaosLevel=0;
      invertedControls=false;
      ballMode=false;
      ghostMode=false;
      teleportMode=false;
      lavaMode=false;
      superFlappyMode=false;
      pipeSpinning=false;
      rainbowMode=false;
      scoreEl.textContent=score;
      chaosMeterEl.style.width='0%';
      chaosTextEl.textContent='0%';
      gameOverDiv.style.display='none'; 
      gameStarted=false; 
      gameRunning=false;
      modeIndicatorEl.textContent='✨ NORMAL MODE ✨';
      statusTextEl.textContent='Ready to fly!';
      bgMusic.currentTime=0; 
      bgMusic.play().catch(()=>{});
    }
 
    musicSel.addEventListener('change',()=>{
      const chosen = musicSel.value;
      const wasPlaying = !bgMusic.paused;
      bgMusic.pause(); bgMusic = new Audio(chosen); bgMusic.loop=true; bgMusic.volume=0.5;
      if(gameStarted || wasPlaying){ bgMusic.play().catch(()=>{}); }
    });
 
    function unlockAudio(){
      [bgMusic,flapSound,hitSound,scoreSound].forEach(a=>{
        a.play().then(()=>{a.pause();a.currentTime=0;}).catch(()=>{});
      });
    }
    document.addEventListener('click', unlockAudio,{once:true});
    document.addEventListener('touchstart', unlockAudio,{once:true});
 
    requestAnimationFrame(gameLoop);
  </script>
